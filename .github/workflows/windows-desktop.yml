name: Windows desktop installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build Windows installers
        run: npm run tauri -- build --ci --bundles nsis,msi
        working-directory: dashboard

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Studyspace-Windows-Installers
          path: |
            dashboard/src-tauri/target/release/bundle/nsis/*.exe
            dashboard/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dashboard/src-tauri/target/release/bundle/nsis/*.exe
            dashboard/src-tauri/target/release/bundle/msi/*.msi
