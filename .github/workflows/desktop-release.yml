name: Desktop installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run app tests
        run: npm test
        working-directory: dashboard

      - name: Build Windows installers
        run: npm run tauri -- build --ci --bundles nsis,msi
        working-directory: dashboard

      - name: Upload Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: Studyspace-Windows-Installers
          path: |
            dashboard/src-tauri/target/release/bundle/nsis/*.exe
            dashboard/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run app tests
        run: npm test
        working-directory: dashboard

      - name: Build macOS app and disk image
        run: npm run tauri -- build --ci --bundles app,dmg
        working-directory: dashboard

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v5
        with:
          name: Studyspace-macOS-Installer
          path: dashboard/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v5
        with:
          name: Studyspace-Windows-Installers
          path: release-assets/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v5
        with:
          name: Studyspace-macOS-Installer
          path: release-assets/macos

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.msi
            release-assets/macos/*.dmg
