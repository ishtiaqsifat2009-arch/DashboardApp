name: Desktop installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run app tests
        run: npm test
        working-directory: dashboard

      - name: Run desktop filesystem tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        working-directory: dashboard

      - name: Build Windows installers
        run: npm run tauri -- build --ci --bundles nsis,msi
        working-directory: dashboard
        env:
          STUDYSPACE_GIT_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Windows app inputs and artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = $env:GITHUB_SHA.Substring(0, 7)
          $bundle = Get-ChildItem dashboard/dist/assets/index-*.js | Select-Object -First 1
          if (-not (Select-String -Path $bundle.FullName -Pattern $revision -SimpleMatch -Quiet)) { throw "Frontend bundle does not identify commit $revision" }
          if (-not (Test-Path dashboard/src-tauri/icons/icon.ico)) { throw "Windows application icon is missing" }
          if (-not (Test-Path dashboard/src-tauri/target/release/studyspace.exe)) { throw "Tauri Windows executable is missing" }
          if (-not (Get-ChildItem dashboard/src-tauri/target/release/bundle/nsis/*.exe)) { throw "NSIS installer was not generated" }
          if (-not (Get-ChildItem dashboard/src-tauri/target/release/bundle/msi/*.msi)) { throw "MSI installer was not generated" }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: Studyspace-Windows-Installers
          path: |
            dashboard/src-tauri/target/release/bundle/nsis/*.exe
            dashboard/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run app tests
        run: npm test
        working-directory: dashboard

      - name: Run desktop filesystem tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        working-directory: dashboard

      - name: Build macOS app and disk image
        run: npm run tauri -- build --ci --bundles app,dmg
        working-directory: dashboard
        env:
          STUDYSPACE_GIT_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v5
        with:
          name: Studyspace-macOS-Installer
          path: |
            dashboard/src-tauri/target/release/bundle/dmg/*.dmg
            dashboard/src-tauri/target/release/bundle/app/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v5
        with:
          name: Studyspace-Windows-Installers
          path: release-assets/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v5
        with:
          name: Studyspace-macOS-Installer
          path: release-assets/macos

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.msi
            release-assets/macos/*.dmg
            release-assets/macos/*.tar.gz
